name: Build Google Sign-In Test APK

on:
  push:
    branches:
      - build/google-signin-test-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Apply Google account chooser fix for this test build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/OjasApp.kt')
          s = p.read_text()

          old_import = 'import com.google.android.libraries.identity.googleid.GetGoogleIdOption'
          new_import = 'import com.google.android.libraries.identity.googleid.GetSignInWithGoogleOption'
          s = s.replace(old_import, new_import)

          old = """                    val googleIdOption = GetGoogleIdOption.Builder()
                        .setFilterByAuthorizedAccounts(false)
                        .setServerClientId(rawClientId)
                        .setAutoSelectEnabled(false)
                        .build()

                    val request = GetCredentialRequest.Builder()
                        .addCredentialOption(googleIdOption)
                        .build()"""

          new = """                    val signInWithGoogleOption = GetSignInWithGoogleOption.Builder(rawClientId)
                        .build()

                    val request = GetCredentialRequest.Builder()
                        .addCredentialOption(signInWithGoogleOption)
                        .build()"""

          if old in s:
              s = s.replace(old, new, 1)
          elif 'GetSignInWithGoogleOption.Builder(rawClientId)' not in s:
              raise SystemExit('Google Sign-In source block was not recognized')

          p.write_text(s)
          PY

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OJAS-google-signin-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
