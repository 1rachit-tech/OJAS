name: Build Google Sign-In Test APK

on:
  push:
    branches:
      - build/google-signin-test-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Apply Google account chooser fix for this test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/ui/OjasApp.kt')
          s = p.read_text()

          s = s.replace(
              'import com.google.android.libraries.identity.googleid.GetGoogleIdOption',
              'import com.google.android.libraries.identity.googleid.GetSignInWithGoogleOption'
          )

          pattern = re.compile(
              r'''(?P<indent>\s*)val googleIdOption = GetGoogleIdOption\.Builder\(\)\n"
              r'''(?P=indent)    \.setFilterByAuthorizedAccounts\(false\)\n"
              r'''(?P=indent)    \.setServerClientId\(rawClientId\)\n"
              r'''(?P=indent)    \.setAutoSelectEnabled\(false\)\n"
              r'''(?P=indent)    \.build\(\)\n\n"
              r'''(?P=indent)val request = GetCredentialRequest\.Builder\(\)\n"
              r'''(?P=indent)    \.addCredentialOption\(googleIdOption\)\n"
              r'''(?P=indent)    \.build\(\)''',
              re.MULTILINE,
          )

          def replacement(match):
              indent = match.group('indent')
              return (
                  f'{indent}val signInWithGoogleOption = GetSignInWithGoogleOption.Builder(rawClientId)\n'
                  f'{indent}    .build()\n\n'
                  f'{indent}val request = GetCredentialRequest.Builder()\n'
                  f'{indent}    .addCredentialOption(signInWithGoogleOption)\n'
                  f'{indent}    .build()'
              )

          updated, count = pattern.subn(replacement, s, count=1)
          if count == 0:
              if 'GetSignInWithGoogleOption.Builder(rawClientId)' not in updated:
                  raise SystemExit('Google Sign-In source block was not recognized')
          p.write_text(updated)
          PY

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OJAS-google-signin-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
